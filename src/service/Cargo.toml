[package]
name = "continuwuity_service"
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
crate-type = [
	"rlib",
#	"dylib",
]

[features]
brotli_compression = [
	"continuwuity-core/brotli_compression",
	"reqwest/brotli",
]
console = [
	"dep:rustyline-async",
	"dep:termimad",
]
element_hacks = []
gzip_compression = [
	"continuwuity-core/gzip_compression",
	"reqwest/gzip",
]
io_uring = [
	"continuwuity-database/io_uring",
]
jemalloc = [
	"continuwuity-core/jemalloc",
	"continuwuity-database/jemalloc",
]
jemalloc_conf = [
	"continuwuity-core/jemalloc_conf",
	"continuwuity-database/jemalloc_conf",
]
jemalloc_prof = [
	"continuwuity-core/jemalloc_prof",
	"continuwuity-database/jemalloc_prof",
]
jemalloc_stats = [
	"continuwuity-core/jemalloc_stats",
	"continuwuity-database/jemalloc_stats",
]
media_thumbnail = [
	"dep:image",
]
release_max_log_level = [
	"continuwuity-core/release_max_log_level",
	"continuwuity-database/release_max_log_level",
	"log/max_level_trace",
	"log/release_max_level_info",
	"tracing/max_level_trace",
	"tracing/release_max_level_info",
]
systemd = [
	"dep:sd-notify",
]
url_preview = [
	"dep:image",
	"dep:webpage",
]
zstd_compression = [
	"continuwuity-core/zstd_compression",
	"continuwuity-database/zstd_compression",
    "reqwest/zstd",
]

[dependencies]
askama.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
