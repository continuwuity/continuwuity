[package]
name = "continuwuity_database"
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
crate-type = [
	"rlib",
#	"dylib",
]

[features]
io_uring = [
	"rust-rocksdb/io-uring",
]
jemalloc = [
	"continuwuity-core/jemalloc",
	"rust-rocksdb/jemalloc",
]
jemalloc_conf = [
	"continuwuity-core/jemalloc_conf",
]
jemalloc_prof = [
	"continuwuity-core/jemalloc_prof",
]
jemalloc_stats = [
	"continuwuity-core/jemalloc_stats",
]
release_max_log_level = [
	"continuwuity-core/release_max_log_level",
	"log/max_level_trace",
	"log/release_max_level_info",
	"tracing/max_level_trace",
	"tracing/release_max_level_info",
]
zstd_compression = [
	"continuwuity-core/zstd_compression",
	"rust-rocksdb/zstd",
]
bindgen-static = [
    # "bindgen/static"
    # "clang-sys/static"
    "rust-rocksdb/bindgen-static"
]
bindgen-runtime = [
    "rust-rocksdb/bindgen-runtime"
]

[dependencies]
async-channel.workspace = true
continuwuity-core.workspace = true
continuwuity-macros.workspace = true
const-str.workspace = true
ctor.workspace = true
dtor.workspace = true
futures.workspace = true
log.workspace = true
minicbor.workspace = true
minicbor-serde.workspace = true
rust-rocksdb.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
