[package]
name = "continuwuity"
default-run = "continuwuity"
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true
metadata.crane.workspace = true

[package.metadata.release]
pre-release-hook = ["sh", "-c", "$WORKSPACE_ROOT/bin/release-script"]

[lib]
path = "mod.rs"
crate-type = [
    "rlib",
    #	"dylib",
]

[package.metadata.deb]
name = "continuwuity"
maintainer = "Continuwuity Team and contributors <team@continuwuity.org>"
license-file = ["../../LICENSE", "3"]
depends = "$auto, ca-certificates"
breaks = ["conduwuit (<<0.5.0)"]
replaces = ["conduwuit (<<0.5.0)"]
extended-description = """A community-driven Matrix homeserver."""
section = "net"
priority = "optional"
conf-files = ["/etc/continuwuity/continuwuity.toml"]
maintainer-scripts = "../../pkg/debian/"
systemd-units = { unit-name = "continuwuity", start = false, unit-scripts = "../../pkg/" }
assets = [
    ["../../pkg/debian/README.md", "usr/share/doc/continuwuity/README.Debian", "644"],
    ["../../README.md", "usr/share/doc/continuwuity/", "644"],
    # cargo-deb only treats the exact prefix "target/release/" as the magic
    # path that resolves to the real build dir (e.g. target/<triple>/release
    # when cross-compiling); a ../../ prefix would be read as a literal path
    ["target/release/continuwuity", "usr/bin/continuwuity", "755"],
    ["../../continuwuity-example.toml", "etc/continuwuity/continuwuity.toml", "640"],
]

[features]
default = [
    "standard",
    "ring",
    "bindgen-runtime", # replace with bindgen-static on alpine
]
standard = [
    "brotli_compression",
    "direct_tls",
    "element_hacks",
    "gzip_compression",
    "io_uring",
    "jemalloc",
    "jemalloc_conf",
    "journald",
    "media_thumbnail",
    "systemd",
    "url_preview",
    "zstd_compression",
    "sentry_telemetry",
    "otlp_telemetry",
    "console",
]
full = [
    "standard",
    # "hardened_malloc", # Conflicts with jemalloc
    "jemalloc_prof",
    "perf_measurements",
    "tokio_console",
]

brotli_compression = [
    "continuwuity-api/brotli_compression",
    "continuwuity-core/brotli_compression",
    "continuwuity-router/brotli_compression",
    "continuwuity-service/brotli_compression",
]
console = [
    "continuwuity-service/console",
]
direct_tls = [
    "continuwuity-router/direct_tls"
]
element_hacks = [
    "continuwuity-api/element_hacks",
    "continuwuity-service/element_hacks",
]
gzip_compression = [
    "continuwuity-api/gzip_compression",
    "continuwuity-core/gzip_compression",
    "continuwuity-router/gzip_compression",
    "continuwuity-service/gzip_compression",
]
hardened_malloc = [
    "continuwuity-core/hardened_malloc",
]
http3 = [
    "reqwest/http3"
]
ring = [
    "rustls/ring"
]
aws_lc_rs = [
    "rustls/aws_lc_rs",
    "dep:aws-lc-rs"
]
io_uring = [
    "continuwuity-database/io_uring",
]
jemalloc = [
    "continuwuity-core/jemalloc",
    "continuwuity-database/jemalloc",
]
jemalloc_prof = [
    "continuwuity-core/jemalloc_prof",
]
jemalloc_stats = [
    "continuwuity-core/jemalloc_stats",
]
jemalloc_conf = [
    "continuwuity-core/jemalloc_conf",
]
media_thumbnail = [
    "continuwuity-service/media_thumbnail",
]
otlp_telemetry = [
    "dep:opentelemetry",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]
perf_measurements = [
    "dep:tracing-flame",
    "otlp_telemetry",
    "continuwuity-core/perf_measurements",
    "continuwuity-core/sentry_telemetry",
]
# increases performance, reduces build times, and reduces binary size by not compiling or
# genreating code for log level filters that users will generally not use (debug and trace)
release_max_log_level = [
    "tracing/max_level_trace",
    "tracing/release_max_level_info",
    "log/max_level_trace",
    "log/release_max_level_info",
    "continuwuity-admin/release_max_log_level",
    "continuwuity-api/release_max_log_level",
    "continuwuity-core/release_max_log_level",
    "continuwuity-database/release_max_log_level",
    "continuwuity-router/release_max_log_level",
    "continuwuity-service/release_max_log_level",
]
sentry_telemetry = [
    "dep:sentry",
    "dep:sentry-tracing",
    "dep:sentry-tower",
    "continuwuity-core/sentry_telemetry",
    "continuwuity-router/sentry_telemetry",
]
systemd = [
    "continuwuity-router/systemd",
    "continuwuity-service/systemd"
]
journald = [# This is a stub on non-unix platforms
    "dep:tracing-journald",
]
openreg = ["continuwuity-core/openreg"]


# enable the tokio_console server ncompatible with release_max_log_level
tokio_console = [
    "dep:console-subscriber",
    "tokio/tracing",
]
url_preview = [
    "continuwuity-service/url_preview",
]
zstd_compression = [
    "continuwuity-api/zstd_compression",
    "continuwuity-core/zstd_compression",
    "continuwuity-database/zstd_compression",
    "continuwuity-router/zstd_compression",
    "continuwuity-service/zstd_compression",
]
continuwuity_mods = [
    "continuwuity-core/continuwuity_mods",
]
bindgen-static = [
    # "bindgen/static"
    # "clang-sys/static"
    "continuwuity-database/bindgen-static"
]
bindgen-runtime = [
    "continuwuity-database/bindgen-runtime"
]

[build-dependencies]
# bindgen = {version = "0.71.1", default-features = false}
# clang-sys = {version = "1", default-features = false}

[dependencies]
continuwuity-admin.workspace = true
continuwuity-api.workspace = true
continuwuity-core.workspace = true
continuwuity-database.workspace = true
continuwuity-router.workspace = true
continuwuity-service.workspace = true
continuwuity-build-metadata.workspace = true
continuwuity-macros.workspace = true

clap.workspace = true
ctor.workspace = true
dtor.workspace = true
console-subscriber.optional = true
console-subscriber.workspace = true
const-str.workspace = true
log.workspace = true
opentelemetry.optional = true
opentelemetry.workspace = true
opentelemetry-otlp.optional = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.optional = true
opentelemetry_sdk.workspace = true
sentry-tower.optional = true
sentry-tower.workspace = true
sentry-tracing.optional = true
sentry-tracing.workspace = true
sentry.optional = true
sentry.workspace = true
tokio-metrics.optional = true
tokio-metrics.workspace = true
tokio.workspace = true
tracing-flame.optional = true
tracing-flame.workspace = true
tracing-opentelemetry.optional = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
tracing-journald = { workspace = true, optional = true }
parking_lot.workspace = true
reqwest = { workspace = true, default-features = false }
rustls = { workspace = true, default-features = false }
aws-lc-rs = { version = "1.16.3", default-features = false, optional = true }


[target.'cfg(all(not(target_env = "msvc"), target_os = "linux"))'.dependencies]
hardened_malloc-rs.workspace = true
hardened_malloc-rs.optional = true

[lints]
workspace = true

[[bin]]
name = "continuwuity"
path = "main.rs"
