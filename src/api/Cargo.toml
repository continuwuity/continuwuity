[package]
name = "continuwuity_api"
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "mod.rs"
crate-type = [
	"rlib",
#	"dylib",
]

[features]
brotli_compression = [
	"continuwuity-core/brotli_compression",
	"continuwuity-service/brotli_compression",
	"reqwest/brotli",
]
element_hacks = [
	"continuwuity-service/element_hacks",
]
gzip_compression = [
	"continuwuity-core/gzip_compression",
	"continuwuity-service/gzip_compression",
	"reqwest/gzip",
]
io_uring = [
	"continuwuity-service/io_uring",
]
jemalloc = [
    "continuwuity-core/jemalloc",
    "continuwuity-service/jemalloc",
]
jemalloc_conf = [
	"continuwuity-core/jemalloc_conf",
	"continuwuity-service/jemalloc_conf",
]
jemalloc_prof = [
	"continuwuity-core/jemalloc_prof",
	"continuwuity-service/jemalloc_prof",
]
jemalloc_stats = [
	"continuwuity-core/jemalloc_stats",
	"continuwuity-service/jemalloc_stats",
]
release_max_log_level = [
	"continuwuity-core/release_max_log_level",
	"continuwuity-service/release_max_log_level",
	"log/max_level_trace",
	"log/release_max_level_info",
	"tracing/max_level_trace",
	"tracing/release_max_level_info",
]
zstd_compression = [
	"continuwuity-core/zstd_compression",
	"continuwuity-service/zstd_compression",
	"reqwest/zstd",
]

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
client-ip.workspace = true
continuwuity-core.workspace = true
continuwuity-macros.workspace = true
continuwuity-service.workspace = true
const-str.workspace = true
ctor.workspace = true
dtor.workspace = true
futures.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
itertools.workspace = true
lettre.workspace = true
log.workspace = true
rand.workspace = true
reqwest.workspace = true
ruma.workspace = true
ruminuwuity.workspace = true
serde_json.workspace = true
serde.workspace = true
sha1.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
