[package]
name = "conduwuit_core"
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
doctest = false
path = "mod.rs"
crate-type = [
    "rlib",
    #	"dylib",
]

[features]
brotli_compression = [
    "reqwest/brotli",
]
gzip_compression = [
    "reqwest/gzip",
]
jemalloc = [
    "dep:tikv-jemalloc-sys",
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemallocator",
]
# Uses mimalloc for Rust allocations and, via `override`, exports
# malloc/free/etc. so C/C++ dependencies (RocksDB, zstd, lz4, ...) use it too.
# Mutually exclusive with `jemalloc` on non-MSVC targets.
mimalloc = [
    "dep:libmimalloc-sys",
    "dep:mimalloc",
    "libmimalloc-sys/override",
]
jemalloc_conf = []
jemalloc_prof = [
    "tikv-jemalloc-sys/profiling",
]
jemalloc_stats = [
    "tikv-jemalloc-sys/stats",
    "tikv-jemalloc-ctl/stats",
    "tikv-jemallocator/stats",
]
perf_measurements = []
release_max_log_level = [
    "tracing/max_level_trace",
    "tracing/release_max_level_info",
]
sentry_telemetry = []
zstd_compression = [
    "reqwest/zstd",
]
openreg = []

