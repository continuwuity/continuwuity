[package]
description.workspace = true
edition.workspace     = true
homepage.workspace    = true
license.workspace     = true
name                  = "conduwuit_web"
readme.workspace      = true
repository.workspace  = true
version.workspace     = true

[lib]
crate-type = [
    "rlib",
    #	"dylib",
]
path = "mod.rs"

[features]


[dependencies]
askama.workspace = true
async-trait.workspace = true
axum.workspace = true
conduwuit-api.workspace = true
conduwuit-build-metadata.workspace = true
conduwuit-core.workspace = true
conduwuit-database.workspace = true
conduwuit-service.workspace = true
form_urlencoded = "1.2.2"
futures.workspace = true
lettre.workspace = true
memory-serve = "2.4.0"
openidconnect.workspace = true
ruma.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true
tower-http.workspace = true
tower-sec-fetch = { features = ["tracing"], version = "0.2.0" }
tower-sessions = { default-features = false, features = [
    "axum-core",
], version = "0.15.0" }
tower-sessions-core = { features = ["deletion-task"], version = "0.15.0" }
tracing.workspace = true
url.workspace = true
validator = { version = "0.21.0", features = ["derive"] }

[build-dependencies]
memory-serve = "2.4.0"

[lints]
workspace = true

[package.metadata.cargo-shear]
# All of these dependencies are only used in Askama templates,
# which are transformed into Rust by a proc macro.
# cargo-shear can't see them because it doesn't expand macros.
ignored = [
    "conduwuit_build_metadata",
    "form_urlencoded",
    "serde_json",
]
